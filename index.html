    <script>
      // Apply the saved theme (dark by default) before first paint.
      (function () {
        var t = "dark";
        try {
          var s = JSON.parse(localStorage.getItem("grade6-atlas:settings") || "{}");
          if (s.theme) t = s.theme;
        } catch (e) {}
        if (t !== "system") document.documentElement.setAttribute("data-theme", t);
      })();
    </script>
    <script>
      // One-time migration from the old single-grade build: unregister its service
      // worker, drop cached HTML/JSON responses and clear legacy grade-6 progress.
      (function () {
        var FLAG = "grade6-atlas:boot-v2";
        try {
          if (localStorage.getItem(FLAG)) return;
        } catch (e) {
          return;
        }
        try {
          var stale = [];
          for (var i = 0; i < localStorage.length; i++) {
            var k = localStorage.key(i);
            if (k && k.indexOf("grade6-atlas:v2:") === 0) stale.push(k);
          }
          stale.forEach(function (k) { localStorage.removeItem(k); });
        } catch (e) {}
        var jobs = [];
        try {
          if ("serviceWorker" in navigator) {
            jobs.push(
              navigator.serviceWorker
                .getRegistrations()
                .then(function (regs) {
                  return Promise.all(regs.map(function (r) { return r.unregister(); }));
                })
                .catch(function () {})
            );
          }
          if ("caches" in window) {
            jobs.push(
              caches
                .keys()
                .then(function (keys) {
                  return Promise.all(keys.map(function (k) { return caches.delete(k); }));
                })
                .catch(function () {})
            );
          }
        } catch (e) {}
        Promise.all(jobs).then(function () {
          try { localStorage.setItem(FLAG, "1"); } catch (e) {}
          if (jobs.length) location.reload();
        });
      })();
    </script>
